<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="self" type="application/atom+xml" href="{{ config.base_url }}/atom.xml" />
    <link rel="alternate" href="{{ config.base_url }}/atom.xml" type="application/atom+xml" title="feeds" />
    <link rel="icon" sizes="192x192" href="{{ config.base_url }}/icon.png" />
    <link rel="stylesheet" href="{{ config.base_url }}/styles.css" />

    <title>Phy F.R.Y.'s (faulty) Blog</title>
  </head>
  <body>
    <header>
        <a class="headlink" href="{{ config.base_url }}">Phy F.R.Y.'s (faulty & temporary) Blog</a>
    </header>
    <div class="notice"><p>This site is currently looking atrocious on purpose. I am plannig to create a theme from scratch but I am lacking "inspiration", and I wanted to start writing some posts.</p></div>
    <section class="section">
      <div class="container">{% block content %} {% endblock content %}</div>
    </section>
    <footer></footer>
  </body>
</html>
